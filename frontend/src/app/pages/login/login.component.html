<div class="login-container">
    <div class="login-wrapper">
        <div class="helpy-login-corner">
            <img src="Helpy/HelpyPlank.webp" alt="Helpy" class="helpy-plank-img" />
        </div>
        <div class="login-box">
            <h2>Iniciar Sesión</h2>
            <p class="subtitle">Bienvenido a Fazbear</p>
            <form (ngSubmit)="login()">
                <div class="form-group">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" [(ngModel)]="usuario" name="usuario"
                        placeholder="Ingresa tu usuario" required />
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" [(ngModel)]="pass" name="password"
                        placeholder="Ingresa tu contraseña" required />
                </div>
                @if (error) {
                <div class="error-message">
                    {{ error }}
                </div>
                }
                <button type="submit" class="btn-login">Entrar</button>
            </form>
            <p class="registro-link">
                ¿No tienes cuenta?
                <a (click)="irRegistro()" style="cursor:pointer">Regístrate aquí</a>
            </p>
        </div>
    </div>
</div>
