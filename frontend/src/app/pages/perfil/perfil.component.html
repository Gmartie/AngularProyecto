<div class="window-overlay" [class.hidden]="isMinimized">
    <div class="window-container" [class.maximized]="isMaximized">
        <div class="window">
            <div class="window-header">
                <div class="window-title">
                    <img src="/Icons/profile_icon.png" alt="Perfil" class="window-icon-img">
                    <span>Mi Perfil</span>
                </div>
                <div class="window-controls">
                    <button class="window-btn minimize" (click)="minimizarVentana()" title="Minimizar">_</button>
                    <button class="window-btn maximize" (click)="toggleMaximizar()"
                        title="Maximizar/Restaurar">□</button>
                    <button class="window-btn close" (click)="cerrarVentana()" title="Cerrar">×</button>
                </div>
            </div>
            <div class="window-content">
                @if (usuario()) {
                <div class="perfil-card">
                    <div class="info-section">
                        @if (!editando() && usuario()) {
                        <div class="info-row">
                            <div class="info-item">
                                <label>Usuario</label>
                                <p>{{ usuario()?.usuario }}</p>
                            </div>
                            <div class="info-item">
                                <label>Email</label>
                                <p>{{ usuario()?.correo }}</p>
                            </div>
                            <div class="info-item">
                                <label>Roles</label>
                                <div class="roles">
                                    <span class="rol-badge">
                                        {{ nombreRol() }}
                                    </span>
                                </div>
                            </div>
                        </div>
                        }
                        @if (editando()) {
                        <div class="formulario">
                            <div class="form-group">
                                <label>Nombre de Usuario</label>
                                <input type="text" [ngModel]="formulario().usuario"
                                    (ngModelChange)="updateUsuario($event)" placeholder="Nombre de usuario" />
                            </div>
                            <div class="form-group">
                                <label>Email</label>
                                <input type="email" [ngModel]="formulario().correo"
                                    (ngModelChange)="updateCorreo($event)" placeholder="tu@email.com" />
                            </div>
                            <div class="form-group">
                                <label>Nueva Contraseña</label>
                                <input type="password" [ngModel]="formulario().password"
                                    (ngModelChange)="updatePassword($event)" placeholder="Nueva contraseña" />
                            </div>
                            <div class="form-group">
                                <label>Confirmar Contraseña</label>
                                <input type="password" [ngModel]="formulario().confirmPassword"
                                    (ngModelChange)="updateConfirmPassword($event)"
                                    placeholder="Confirmar contraseña" />
                            </div>
                            @if (error()) {
                            <div class="error-message">
                                {{ error() }}
                            </div>
                            }
                            @if (exito()) {
                            <div class="exito-message">
                                Cambios guardados exitosamente
                            </div>
                            }
                            <div class="form-buttons">
                                <button (click)="guardarCambios()" [disabled]="cargando()" class="btn-guardar">
                                    {{ cargando() ? 'Guardando...' : 'Guardar Cambios' }}
                                </button>
                                <button (click)="cancelar()" class="btn-cancelar">
                                    Cancelar
                                </button>
                            </div>
                        </div>
                        }
                        @if (!editando()) {
                        <div class="perfil-buttons">
                            <button (click)="toggleEditar()" class="btn-editar">
                                Editar Perfil
                            </button>
                        </div>
                        }
                    </div>
                </div>
                }
            </div>
        </div>
    </div>
</div>
<app-taskbar windowId="perfil"></app-taskbar>
