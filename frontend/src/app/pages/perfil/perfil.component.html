<!-- COMPONENTE: Perfil - Información del Usuario -->
<!-- Muestra y permite editar datos personales del usuario -->

<div class="container">
  <div class="perfil-header">
    <h1>Mi Perfil</h1>
  </div>

  <div class="perfil-card" *ngIf="usuario">
    <div class="info-section">
      <h3>Información Personal</h3>

      <div class="info-row" *ngIf="!editando && usuario()">
        <div class="info-item">
          <label>Usuario</label>
          <p>{{ usuario()?.usuario }}</p>
        </div>
        <div class="info-item">
          <label>Email</label>
          <p>{{ usuario()?.email }}</p>
        </div>
        <div class="info-item">
          <label>Roles</label>
          <div class="roles">
            <span *ngFor="let rol of usuario()?.roles" class="rol-badge">
              {{ rol }}
            </span>
          </div>
        </div>
      </div>

      <div *ngIf="editando" class="formulario">
        <div class="form-group">
          <label>Email</label>
          <input
            type="email"
            [ngModel]="formulario().email"
            (ngModelChange)="updateEmail($event)"
            placeholder="tu@email.com"
          />
        </div>

        <div class="form-group">
          <label>Nueva Contraseña (Dejar en blanco para no cambiar)</label>
          <input
            type="password"
            [ngModel]="formulario().password"
            (ngModelChange)="updatePassword($event)"
            placeholder="Nueva contraseña"
          />
        </div>

        <div class="form-group">
          <label>Confirmar Contraseña</label>
          <input
            type="password"
            [ngModel]="formulario().confirmPassword"
            (ngModelChange)="updateConfirmPassword($event)"
            placeholder="Confirmar contraseña"
          />
        </div>

        <div *ngIf="error()" class="error-message">
          {{ error() }}
        </div>

        <div *ngIf="exito()" class="exito-message">
          ✅ Cambios guardados exitosamente
        </div>

        <div class="form-buttons">
          <button (click)="guardarCambios()" [disabled]="cargando()" class="btn-guardar">
            {{ cargando() ? 'Guardando...' : 'Guardar Cambios' }}
          </button>
          <button (click)="cancelar()" class="btn-cancelar">Cancelar</button>
        </div>
      </div>

      <div *ngIf="!editando" class="perfil-buttons">
        <button (click)="toggleEditar()" class="btn-editar">✏️ Editar Perfil</button>
      </div>
    </div>
  </div>
</div>
