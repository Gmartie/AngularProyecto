<div class="registro-container">
    <div class="registro-box">
        <h2>Crear Cuenta</h2>
        <p class="subtitle">Únete a Fazbear</p>
        @if (!exito()) {
        <form (ngSubmit)="registrarse()">
            <div class="form-group">
                <label for="usuario">Usuario</label>
                <input type="text" id="usuario" [ngModel]="usuario()" (ngModelChange)="usuario.set($event)"
                    name="usuario" placeholder="Elige tu usuario" required />
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" [ngModel]="email()" (ngModelChange)="email.set($event)" name="email"
                    placeholder="tu@email.com" required />
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" [ngModel]="password()" (ngModelChange)="password.set($event)"
                    name="password" placeholder="Mínimo 6 caracteres" required />
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" [ngModel]="confirmPassword()"
                    (ngModelChange)="confirmPassword.set($event)" name="confirmPassword"
                    placeholder="Repite tu contraseña" required />
            </div>
            @if (error()) {
            <div class="error-message">
                {{ error() }}
            </div>
            }
            <button type="submit" [disabled]="cargando()" class="btn-registro">
                {{ cargando() ? 'Registrando...' : 'Registrarse' }}
            </button>
        </form>
        }
        @if (exito()) {
        <div class="exito-container">
            <div class="exito-message">
                <div class="mensaje-texto">
                    <p> Cuenta creada exitosamente</p>
                    <p>Serás redirigido al login en breve...</p>
                </div>
                <div class="helpy-exito">
                    <img src="/Helpy/Helpyhop.webp" alt="Helpy celebrando" class="helpy-hop-img" />
                </div>
            </div>
        </div>
        }
        <p class="login-link">
            ¿Ya tienes cuenta?
            <a (click)="irLogin()" style="cursor:pointer">Inicia sesión aquí</a>
        </p>
    </div>
    @if (!exito()) {
    <div class="helpy-registro">
        <img src="/Helpy/HelpyLook.webp" alt="Helpy observando" class="helpy-look-img" />
    </div>
    }
</div>
